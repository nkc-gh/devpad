# Config location: /etc/auto-cpufreq.conf

[charger]
governor = performance
turbo = always

[battery]
governor = powersave
energy_performance_preference = balance_power
turbo = auto

# governor = performance -> max speed strategy since power isn't a concern on AC
# turbo = always -> forces boost clocks on continuously, no throttling back
# governor = powersave -> efficiency-first strategy as the baseline on battery
# energy_performance_preference = balance_power -> keeps CPU responsive to input so it doesn't feel sluggish, while still leaning power-efficient overall
# turbo = auto -> lets CPU burst to boost clocks only when actually needed, instead of banning it outright — avoids lag while still saving power most of the time